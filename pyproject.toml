[project]
name = "harness-on-steroids"
version = "0.0.1"
requires-python = ">=3.11"
description = "Codex-transcript gold analysis; Kilo and OpenCode imitate"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["data", "reports", ".kilo", ".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
pretty = true
