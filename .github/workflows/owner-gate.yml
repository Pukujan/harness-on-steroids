name: owner-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  owner-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install pytest
      - name: properties
        run: pytest tests/test_properties.py
      - name: hidden-holdout
        run: pytest tests/test_hidden_holdout.py
      - name: mutations
        run: pytest tests/test_mutations.py
      - name: metamorphic
        run: pytest tests/test_metamorphic.py
      - name: differential
        run: pytest tests/test_differential.py
      - name: iteration-loop
        run: pytest tests/test_iteration_loop.py
      - name: ci-contract
        run: pytest tests/test_ci_contract.py
      - name: imitate-modes
        run: pytest tests/test_imitate_modes.py
      - name: goal-loop
        run: pytest tests/test_goal_loop.py
      - name: goal-fuzz
        run: pytest tests/test_goal_fuzz.py
      - name: prompt-stack
        run: pytest tests/test_prompt_stack.py
      - name: score-session
        run: pytest tests/test_score_session.py
      - name: future-agent-pattern
        run: pytest tests/test_future_agent_pattern.py
      - name: work-vs-vscode
        run: pytest tests/test_work_vs_vscode.py
      - name: work-shapes
        run: pytest tests/test_work_shapes.py
      - name: work-wait
        run: pytest tests/test_work_wait.py
      - name: work-js-shell
        run: pytest tests/test_work_js_shell.py
      - name: work-wait-clusters
        run: pytest tests/test_work_wait_clusters.py
      - name: work-send
        run: pytest tests/test_work_send.py
      - name: work-plan
        run: pytest tests/test_work_plan.py
      - name: work-self-score
        run: pytest tests/test_work_self_score.py
      - name: work-empty
        run: pytest tests/test_work_empty.py
      - name: goal-uses-codex-agent
        run: pytest tests/test_goal_uses_codex_agent.py
      - name: empty-by-originator
        run: pytest tests/test_empty_by_originator.py
      - name: exec-empty
        run: pytest tests/test_exec_empty.py
      - name: exec-vs-work
        run: pytest tests/test_exec_vs_work.py
      - name: desktop-vs-work
        run: pytest tests/test_desktop_vs_work.py
      - name: vscode-vs-work
        run: pytest tests/test_vscode_vs_work.py
      - name: patch-by-originator
        run: pytest tests/test_patch_by_originator.py
      - name: wait-by-originator
        run: pytest tests/test_wait_by_originator.py
      - name: send-by-originator
        run: pytest tests/test_send_by_originator.py
      - name: plan-by-originator
        run: pytest tests/test_plan_by_originator.py
      - name: originator-dashboard
        run: pytest tests/test_originator_dashboard.py
      - name: shell-by-originator
        run: pytest tests/test_shell_by_originator.py
      - name: js-by-originator
        run: pytest tests/test_js_by_originator.py
      - name: work-match-by-agent
        run: pytest tests/test_work_match_by_agent.py
      - name: fail-mask-by-agent
        run: pytest tests/test_fail_mask_by_agent.py
      - name: matched-task-eval
        run: pytest tests/test_matched_task_eval.py
      - name: work-replay-buckets
        run: pytest tests/test_work_replay_buckets.py
      - name: extract-replay
        run: pytest tests/test_extract_replay.py
      - name: long-replay-set
        run: pytest tests/test_long_replay_set.py
